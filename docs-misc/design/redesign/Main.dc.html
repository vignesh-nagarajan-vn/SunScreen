      <rect x="252" y="112" width="76" height="76" rx="4" style="fill: #D9D3CE"></rect>
      <rect x="354" y="114" width="72" height="30" rx="4" style="fill: #E4E0DC"></rect><rect x="354" y="152" width="72" height="34" rx="4" style="fill: #E4E0DC"></rect>

      <rect x="454" y="314" width="72" height="72" rx="4" style="fill: #E4E0DC"></rect>

      <rect x="-48" y="412" width="76" height="76" rx="4" style="fill: #D9D3CE"></rect>
      <rect x="54" y="414" width="72" height="72" rx="4" style="fill: #E4E0DC"></rect>
      <rect x="154" y="414" width="72" height="30" rx="4" style="fill: #E4E0DC"></rect><rect x="154" y="452" width="72" height="34" rx="4" style="fill: #E4E0DC"></rect>
      <rect x="250" y="410" width="80" height="80" rx="10" style="fill: #DDE6D3"></rect>
      <rect x="354" y="414" width="72" height="72" rx="4" style="fill: #E4E0DC"></rect>
      <rect x="454" y="414" width="72" height="30" rx="4" style="fill: #E4E0DC"></rect><rect x="454" y="452" width="72" height="34" rx="4" style="fill: #E4E0DC"></rect>

      <line x1="-300" y1="-100" x2="700" y2="-100" style="stroke: #FFFFFF; stroke-width: 9"></line>
      <line x1="-300" y1="0" x2="700" y2="0" style="stroke: #FFFFFF; stroke-width: 9"></line>
      <line x1="-300" y1="100" x2="700" y2="100" style="stroke: #FFFFFF; stroke-width: 9"></line>
      <line x1="-300" y1="200" x2="700" y2="200" style="stroke: #FFFFFF; stroke-width: 14"></line>
      <line x1="-300" y1="300" x2="700" y2="300" style="stroke: #FFFFFF; stroke-width: 9"></line>
      <line x1="-300" y1="400" x2="700" y2="400" style="stroke: #FFFFFF; stroke-width: 9"></line>
      <line x1="-60" y1="-300" x2="-60" y2="800" style="stroke: #FFFFFF; stroke-width: 9"></line>

    </g>

    <!-- Unselected routes, thin -->
    <polyline points="268,372 236,330 210,292 182,252 158,220 142,198" style="fill: none; stroke: #8c8c8c; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 7; opacity: 0.7"></polyline>
    <polyline points="268,372 240,362 210,356 196,322 182,290 162,262 140,238 142,198" style="fill: none; stroke: #b0636b; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55"></polyline>
    <polyline points="268,372 252,352 246,322 258,296 240,268 226,236 196,216 170,206 142,198" style="fill: none; stroke: #500000; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.4"></polyline>

    <!-- Selected route, colored by shade and sun -->
    <sc-if value="{{isFast}}" hint-placeholder-val="{{ false }}">
      <g>
        <polyline points="268,372 236,330 210,292 182,252 158,220 142,198" style="fill: none; stroke: #FFFFFF; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round"></polyline>
        <polyline points="268,372 236,330 210,292 182,252 158,220 142,198" style="fill: none; stroke: #6B6B6B; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round"></polyline>
        <polyline points="236,330 210,292" style="fill: none; stroke: #E0A21B; stroke-width: 6; stroke-linecap: round"></polyline>
        <polyline points="182,252 158,220" style="fill: none; stroke: #E0A21B; stroke-width: 6; stroke-linecap: round"></polyline>
      </g>
    </sc-if>
    <sc-if value="{{isRec}}" hint-placeholder-val="{{ true }}">
      <g>
        <polyline points="268,372 252,352 246,322 258,296 240,268 226,236 196,216 170,206 142,198" style="fill: none; stroke: #FFFFFF; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round"></polyline>
        <polyline points="268,372 252,352 246,322 258,296 240,268 226,236 196,216 170,206 142,198" style="fill: none; stroke: #500000; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round"></polyline>
        <polyline points="246,322 258,296" style="fill: none; stroke: #E0A21B; stroke-width: 6; stroke-linecap: round"></polyline>
        <polyline points="196,216 170,206" style="fill: none; stroke: #E0A21B; stroke-width: 6; stroke-linecap: round"></polyline>
      </g>
    </sc-if>
    <sc-if value="{{isMax}}" hint-placeholder-val="{{ false }}">
      <g>
        <polyline points="268,372 240,362 210,356 196,322 182,290 162,262 140,238 142,198" style="fill: none; stroke: #FFFFFF; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round"></polyline>
        <polyline points="268,372 240,362 210,356 196,322 182,290 162,262 140,238 142,198" style="fill: none; stroke: #8E3F48; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round"></polyline>
        <polyline points="210,356 196,322" style="fill: none; stroke: #E0A21B; stroke-width: 6; stroke-linecap: round"></polyline>
      </g>
    </sc-if>

    <circle cx="268" cy="372" r="8" style="fill: #FFFFFF; stroke: #500000; stroke-width: 4"></circle>
    <circle cx="142" cy="198" r="10" style="fill: #500000; stroke: #FFFFFF; stroke-width: 3"></circle>
  </svg>

  <!-- Place labels -->
  <div style="position: absolute; left: 70px; top: 158px; padding: 5px 10px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(40, 10, 10, 0.14); font-size: 12px; font-weight: 700; color: #500000">Zachry Engineering</div>
  <div style="position: absolute; left: 284px; top: 359px; padding: 5px 10px; border-radius: 10px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(40, 10, 10, 0.14); font-size: 12px; font-weight: 700; color: #500000">The Commons</div>

  <!-- Legend -->
  <div style="position: absolute; left: 12px; top: 368px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.92); font-size: 12px; font-weight: 600; color: #1d1d1f">
    <span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 5px; border-radius: 3px; background: #500000"></span>Shade</span>
    <span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 5px; border-radius: 3px; background: #E0A21B"></span>Sun</span>
  </div>

  <!-- Trip card -->
  <div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 6px 24px rgba(40, 10, 10, 0.14)">
    <div aria-hidden="true" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0">
      <span style="width: 8px; height: 8px; border-radius: 50%; border: 2.5px solid #500000"></span>
      <span style="width: 2px; height: 26px; background-image: linear-gradient(#C9BDBD 50%, transparent 50%); background-size: 2px 6px"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #500000"></span>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <a href="Picker.dc.html" aria-label="Start: The Commons. Change" style="display: flex; flex-direction: column; justify-content: center; min-height: 48px; text-decoration: none; color: #1d1d1f">
        <span style="font-size: 11px; font-weight: 600; color: #5c5c62">From</span>
        <span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The Commons</span>
      </a>
      <div style="height: 1px; background: #EEE6E6"></div>
      <a href="Picker.dc.html" aria-label="Destination: Zachry Engineering. Change" style="display: flex; flex-direction: column; justify-content: center; min-height: 48px; text-decoration: none; color: #1d1d1f">
        <span style="font-size: 11px; font-weight: 600; color: #5c5c62">To</span>
        <span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Zachry Engineering</span>
      </a>
    </div>
    <button aria-label="Swap start and destination" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 14px; background: #F8EEEE; color: #500000; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg>
    </button>
  </div>

  <!-- Map controls -->
  <div style="position: absolute; right: 12px; top: 144px; display: flex; flex-direction: column; gap: 8px">
    <a href="Night.dc.html" aria-label="Switch to night mode" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; color: #1d1d1f; box-shadow: 0 3px 12px rgba(40, 10, 10, 0.16)">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
    </a>
    <button aria-label="Route settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #FFFFFF; color: #1d1d1f; box-shadow: 0 3px 12px rgba(40, 10, 10, 0.16); cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </button>
    <button aria-label="How SunScreen works" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #FFFFFF; color: #1d1d1f; box-shadow: 0 3px 12px rgba(40, 10, 10, 0.16); cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.01"></path></svg>
    </button>
  </div>

  <!-- Bottom sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; padding: 8px 20px 24px; border-radius: 28px 28px 0 0; background: #FFFFFF; box-shadow: 0 -8px 30px rgba(40, 10, 10, 0.12)">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #DDD3D3"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 28px; font-weight: 800; line-height: 1.1; color: #500000; letter-spacing: -0.5px">{{timeText}}</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #5c5c62">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: #C48A10; stroke-width: 2.4; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          {{weather}}
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex: none">
        <button onClick="{{goNow}}" style="height: 44px; padding: 0 16px; border: 1.5px solid #E6DDDD; border-radius: 22px; background: #FFFFFF; color: #500000; font-size: 14px; font-weight: 700; cursor: pointer">Now</button>
        <button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: #500000; color: #FFFFFF; cursor: pointer">
          <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg>
          </sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"></path></svg>
          </sc-if>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; height: 40px">
        <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 3px">
          <sc-for list="{{slots}}" as="s" hint-placeholder-count="27">
            <span style="flex: 1; height: {{s.h}}px; border-radius: 3px; background: {{s.bg}}"></span>
          </sc-for>
        </div>
        <input type="range" min="0" max="26" step="1" value="{{slot}}" onChange="{{onScrub}}" aria-label="Departure time" aria-valuetext="{{timeText}}" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #5c5c62">
        <span>7 AM</span><span>11 AM</span><span>3 PM</span><span>8 PM</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{routes}}" as="r" hint-placeholder-count="3">
        <button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" style="display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 10px; border: 1.5px solid {{r.border}}; border-radius: 14px; background: {{r.bg}}; text-align: left; cursor: pointer; color: #1d1d1f">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: #5c5c62; white-space: nowrap">
            <span style="width: 8px; height: 8px; border-radius: 50%; flex: none; background: {{r.dot}}"></span>{{r.label}}
          </span>
          <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.3px">{{r.time}}</span>
          <span style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #F0B53A">
            <span style="width: {{r.shadeW}}; background: {{r.dot}}"></span>
          </span>
          <span style="font-size: 12px; font-weight: 600; color: #5c5c62">{{r.shadeText}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #FDF3DC; color: #9A6A00">
        <svg width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4 4l16 16"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0" aria-live="polite">
        <span style="font-size: 14px; font-weight: 700">{{insightTitle}}</span>
        <span style="font-size: 12px; font-weight: 500; color: #5c5c62">{{insightSub}}</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="flex: 1.7; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; background: #500000; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor"><path d="M12 2.5l7.5 18.2a.6.6 0 0 1-.85.74L12 18l-6.65 3.44a.6.6 0 0 1-.85-.74z"></path></svg>
        Start in Google Maps
      </button>
      <button style="flex: 1; height: 50px; border: 1.5px solid #E6DDDD; border-radius: 14px; background: #FFFFFF; color: #500000; font-size: 15px; font-weight: 700; cursor: pointer">Apple Maps</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ROUTES = [
  { id: 'fastest', label: 'Fastest', dot: '#6B6B6B', min: 10.7, m: 925, extra: '', shade: 45, sun: 6.0 },
  { id: 'recommended', label: 'Recommended', dot: '#500000', min: 11.7, m: 983, extra: '+58 s', shade: 73, sun: 3.0 },
  { id: 'max_shade', label: 'Max shade', dot: '#8E3F48', min: 12.6, m: 1042, extra: '+1.9 min', shade: 84, sun: 1.8 }
];

function sunAt(min) {
  var t = min / 60;
  var s = Math.sin(Math.PI * (t - 7.3) / (18.9 - 7.3));
  if (t < 7.3 || t > 18.9 || s <= 0) return { alt: 0, pct: 0 };
  return { alt: Math.round(48 * s), pct: Math.min(96, Math.round(98 * Math.sqrt(s))) };
}

function clock(min) {
  var h = Math.floor(min / 60), m = min % 60;
  return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + ' ' + (min < 720 ? 'AM' : 'PM');
}

function fewer(mins) {
  return mins >= 1 ? (Math.round(mins * 10) / 10) + ' fewer min' : Math.round(mins * 60) + ' fewer s';
}

class Component extends DCLogic {
  state = { slot: 14, route: 'recommended', playing: false };

  componentWillUnmount() { clearInterval(this.timer); }

  stop() { clearInterval(this.timer); this.timer = null; }

  togglePlay() {
    if (this.state.playing) { this.stop(); this.setState({ playing: false }); return; }
    this.setState({ playing: true, slot: this.state.slot >= 26 ? 0 : this.state.slot });
    this.timer = setInterval(() => {
      var next = this.state.slot + 1;
      if (next > 26) { this.stop(); this.setState({ playing: false }); }
      else this.setState({ slot: next });
    }, 450);
  }

  renderVals() {
    var slot = this.state.slot;
    var min = 420 + slot * 30;
    var sun = sunAt(min);

    var slots = [];
    for (var i = 0; i < 27; i++) {
      var s = sunAt(420 + i * 30);
      var h = s.pct ? Math.max(6, Math.round(40 * s.pct / 100)) : 4;
      slots.push(i === slot
        ? { h: Math.max(h, 16), bg: '#500000' }
        : { h: h, bg: s.pct ? '#EFC66E' : '#DDD6D3' });
    }

    var withSun = ROUTES.map(function (r) {
      return Object.assign({}, r, { sunMin: Math.round(r.sun * sun.pct / 96 * 10) / 10 });
    });
    var selected = withSun.find((r) => r.id === this.state.route);
    var fastest = withSun[0];

    var routes = withSun.map((r) => {
      var on = r.id === this.state.route;
      return {
        label: r.label, dot: r.dot, time: r.min + ' min',
        shadeW: r.shade + '%', shadeText: r.shade + '% shade',
        border: on ? '#500000' : '#E6DDDD', bg: on ? '#F8EEEE' : '#FFFFFF', pressed: on,
        aria: r.label + ': ' + r.min + ' minutes, ' + r.shade + ' percent shaded',
        pick: () => this.setState({ route: r.id })
      };
    });

    var insightTitle, insightSub;
    if (!sun.pct) {
      insightTitle = 'The sun is down';
      insightSub = 'Every route is shaded. Night mode routes by streetlights.';
    } else if (selected.id === 'fastest') {
      insightTitle = 'Quickest way there';
      insightSub = selected.m + ' m · ' + selected.sunMin + ' min in direct sun';
    } else {
      var saved = fastest.sunMin - selected.sunMin;
      insightTitle = selected.extra + ' walk, ' + fewer(saved) + ' in sun';
      insightSub = selected.m + ' m · ' + selected.sunMin + ' min in direct sun';
    }

    return {
      slot: slot,
      slots: slots,
      timeText: clock(min),
      weather: sun.pct ? 'Clear · ' + sun.pct + '% sunlight · ' + sun.alt + '° up' : 'Sun down',
      playing: this.state.playing,
      paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pause day preview' : 'Play through the day',
      togglePlay: () => this.togglePlay(),
      goNow: () => { this.stop(); this.setState({ playing: false, slot: 14 }); },
      onScrub: (e) => { this.stop(); this.setState({ playing: false, slot: Number(e.target.value) }); },
      routes: routes,
      isFast: this.state.route === 'fastest',
      isRec: this.state.route === 'recommended',
      isMax: this.state.route === 'max_shade',
      insightTitle: insightTitle,
      insightSub: insightSub
    };
  }
}
</script>
</body>
</html>
